<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass Navbar</title>
<style>
  :root{ --iw:min(96px,calc((100vw - 40px)/6)); }
  .lg-in{ --bar:rgba(236,239,244,.8); --solid:#eceff4; --off:rgba(20,24,32,.5); --on:#0b0d12; }
  .lg-in[data-theme="dark"]{ --bar:rgba(13,13,16,.93); --solid:#0d0d10; --off:rgba(255,255,255,.42); --on:#fff; }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;color:#1b1e25;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0 1px,transparent 1px 90px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.045) 0 1px,transparent 1px 90px),
      linear-gradient(160deg,#aeb5c0,#d8dce3)}
  section{min-height:100vh;display:grid;place-items:center;padding:140px 24px 40px;font-size:clamp(2.2rem,7vw,5rem);font-weight:700;letter-spacing:-.04em;color:rgba(20,24,32,.85)}

  /* ================= LIQUID GLASS NAV ================= */
  .lg{position:fixed;top:28px;left:0;right:0;z-index:100;display:flex;justify-content:center;pointer-events:none}
  .lg-in{position:relative;pointer-events:auto}

  .track{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--bar);
    -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
    box-shadow:0 14px 36px rgba(30,40,60,.18),0 2px 6px rgba(30,40,60,.12),inset 0 0 0 1px rgba(255,255,255,.65),inset 0 1px 0 rgba(255,255,255,.95);
    touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
  .track a{width:var(--iw);height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--off);text-decoration:none;font-size:11px;font-weight:500;letter-spacing:-.005em;line-height:1;
    -webkit-tap-highlight-color:transparent;border-radius:24px}
  .track a:focus-visible{outline:2px solid #5aa8ff;outline-offset:-3px}
  .track svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* the lens: shows a magnified, refracted copy of the bar underneath it */
  .lens{position:absolute;left:0;top:0;overflow:hidden;pointer-events:none;will-change:transform;
    box-shadow:0 8px 24px rgba(30,40,60,.22),0 0 0 .5px rgba(30,40,60,.16);
    -webkit-backdrop-filter:blur(1px) saturate(1.5) brightness(1.1);backdrop-filter:blur(1px) saturate(1.5) brightness(1.1)}
  .refr{position:absolute;filter:url(#lgRefr)}
  .clone{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .lens .track{position:absolute;left:0;top:0;background:var(--solid);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .lens .track a{color:var(--on);transition:color .25s}
  .lens .track a.sel{color:#007aff}
  .track a,.track svg{-webkit-user-drag:none;user-drag:none}

  .gloss{position:absolute;inset:0;border-radius:inherit;
    background:
      linear-gradient(to bottom,rgba(255,255,255,calc(.55*var(--p,0))) 0,transparent 20%,transparent 80%,rgba(255,255,255,calc(.42*var(--p,0))) 100%),
      rgba(255,255,255,calc(.5*(1 - var(--p,0))));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 2px 2px -1px rgba(255,255,255,.95),
      inset 0 -2px 2px -1px rgba(255,255,255,.6),inset 0 0 20px rgba(255,255,255,.14),inset 0 -10px 16px -10px rgba(0,0,0,.14)}
  .gloss::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
    background:linear-gradient(135deg,rgba(255,255,255,1),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 66%,rgba(255,255,255,.75));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

  @media (max-width:480px){ .track a{font-size:9.5px;height:56px} .track svg{width:19px;height:19px} }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lgRefr" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="lgMap" x="0" y="0" width="100" height="100" result="m"/>
    <feDisplacementMap id="lgDisp" in="SourceGraphic" in2="m" scale="58" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- ============ NAVBAR (copy from here) ============ -->
<div class="lg">
  <div class="lg-in" id="lgIn" data-theme="light">
    <nav class="track" id="track" aria-label="Main">
      <a href="#about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg><span>About</span></a>
      <a href="#services"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span>Services</span></a>
      <a href="#team"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Team</span></a>
      <a href="#technology"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg><span>Technology</span></a>
      <a href="#blogs"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Blogs</span></a>
      <a href="#products"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg><span>Products</span></a>
    </nav>
    <div class="lens" id="lens" aria-hidden="true">
      <div class="refr" id="refr"><div class="clone" id="clone"></div></div>
      <i class="gloss"></i>
    </div>
  </div>
</div>
<!-- ============ (to here) ============ -->

<section id="about">About</section>
<section id="services">Services</section>
<section id="team">Team</section>
<section id="technology">Technology</section>
<section id="blogs">Blogs</section>
<section id="products">Products</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const track = $('track'), lens = $('lens'), refr = $('refr'), clone = $('clone'), fe = $('lgMap'), fd = $('lgDisp');
  const items = [...track.querySelectorAll('a')];
  const M = 30;                       // refraction margin around the lens (px)
  const PRESS = 0.3;                  // how much the lens grows while pressed
  let W, H, Y, active = 0, down = false, moved = false, startX = 0, lock = false, lockT;

  /* magnified copy of the bar that lives inside the lens */
  const copy = track.cloneNode(true);
  copy.removeAttribute('id');
  copy.querySelectorAll('a').forEach(a => { a.removeAttribute('href'); a.tabIndex = -1; });
  clone.appendChild(copy);

  /* displacement map: glass bends the image only near the rim, like a convex lens */
  function buildMap() {
    const w = W + 2 * M, h = H + 2 * M, r = Math.min(W, H) * .48, bezel = Math.min(W, H) * .27, A = 0;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'), img = cx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const px = x + .5 - w / 2, py = y + .5 - h / 2;
      const qx = Math.abs(px) - (W / 2 - r), qy = Math.abs(py) - (H / 2 - r);
      const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
      const depth = -(Math.hypot(ox, oy) + Math.min(Math.max(qx, qy), 0) - r);
      let dx = 0, dy = 0;
      if (depth > 0) {
        const e = Math.min(depth / bezel, 1), k = e * e * (3 - 2 * e);   // 0 at rim → 1 inside
        const rim = Math.pow(1 - e, 2);
        let nx, ny;
        if (ox > 0 || oy > 0) { const l = Math.hypot(ox, oy) || 1; nx = ox / l * Math.sign(px); ny = oy / l * Math.sign(py); }
        else if (qx > qy) { nx = Math.sign(px); ny = 0; } else { nx = 0; ny = Math.sign(py); }
        dx = Math.max(-1, Math.min(1, nx * rim - px / (W / 2) * A * k));
        dy = Math.max(-1, Math.min(1, ny * rim - py / (H / 2) * A * k));
      }
      const i = (y * w + x) * 4;
      d[i] = 128 + dx * 127; d[i + 1] = 128 + dy * 127; d[i + 2] = 128; d[i + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
    const url = cv.toDataURL();
    fe.setAttribute('href', url); fe.setAttributeNS('http://www.w3.org/1999/xlink', 'href', url);
    fe.setAttribute('width', w); fe.setAttribute('height', h);
  }

  function measure() {
    W = items[0].offsetWidth; H = items[0].offsetHeight; Y = items[0].offsetTop;
    copy.style.width = track.offsetWidth + 'px'; copy.style.height = track.offsetHeight + 'px';
    lens.style.width = W + 'px'; lens.style.height = H + 'px'; lens.style.borderRadius = Math.min(W, H) * .48 + 'px';
    refr.style.inset = -M + 'px';
    buildMap();
    st.tx = st.x = items[active].offsetLeft; render();
  }

  /* ---------------- spring physics ---------------- */
  const st = { x: 0, v: 0, tx: 0, p: 0, pv: 0, tp: 0, s: 0 };
  const STRETCH = 0.38;               // horizontal stretch at full speed (raise for a longer lens)
  const KX = 190, CX = 20;            // position spring (under-damped → overshoot)
  const KP = 230, CP = 14;            // press spring (bouncy grow / release)
  let running = false, last = 0;

  function render() {
    const speed = st.s;                                            // smoothed speed 0..1 → stretch
    const S = 1 + PRESS * st.p, sx = S * (1 + STRETCH * speed), sy = S * (1 - .1 * speed);
    const pad = items[0].offsetLeft, hw = W * sx / 2;               // keep the lens inside the bar
    const cx = Math.max(pad + hw, Math.min(track.offsetWidth - pad - hw, st.x + W / 2));
    const x = cx - W / 2;
    lens.style.transform = `translate3d(${x}px,${Y}px,0) scale(${sx},${sy})`;
    const kx = S / sx, ky = S / sy, ccx = x + W / 2, ccy = Y + H / 2;   // counter-scale: content never stretches
    clone.style.transform = `translate3d(${M + W / 2 - kx * ccx}px,${M + H / 2 - ky * ccy}px,0) scale(${kx},${ky})`;
    lens.style.setProperty('--p', Math.max(0, Math.min(1, st.p)).toFixed(3));
    fd.setAttribute('scale', (8 + 50 * Math.max(0, Math.min(1.1, Math.max(st.p, st.s)))).toFixed(1));   // calm glass at rest, strong bend when pressed/moving
  }
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .033); last = now;
    const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
    for (let i = 0; i < n; i++) {
      st.v += (-(down ? 700 : KX) * (st.x - st.tx) - (down ? 45 : CX) * st.v) * h; st.x += st.v * h;
      st.pv += (-KP * (st.p - st.tp) - CP * st.pv) * h; st.p += st.pv * h;
    }
    st.s += (Math.min(Math.abs(st.v) / 1200, 1) - st.s) * Math.min(1, dt * 14);
    render();
    if (st.s < .01 && Math.abs(st.x - st.tx) < .05 && Math.abs(st.v) < .5 && Math.abs(st.p - st.tp) < .002 && Math.abs(st.pv) < .02) {
      st.x = st.tx; st.p = st.tp; st.v = st.pv = st.s = 0; render(); running = false; if (!down) setSel(true);
    } else requestAnimationFrame(frame);
  }
  function kick() { setSel(false); if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }

  /* ---------------- interaction ---------------- */
  items.forEach(a => { a.draggable = false; });
  track.addEventListener('dragstart', e => e.preventDefault());
  const cItems = [...copy.querySelectorAll('a')];
  const setSel = on => cItems.forEach((a, i) => a.classList.toggle('sel', on && i === active));
  const minX = () => items[0].offsetLeft, maxX = () => items[items.length - 1].offsetLeft;
  const clampX = x => Math.max(minX(), Math.min(maxX(), x));
  const nearest = x => items.reduce((b, a, i) => Math.abs(a.offsetLeft - x) < Math.abs(items[b].offsetLeft - x) ? i : b, 0);
  const localX = e => e.clientX - track.getBoundingClientRect().left - W / 2;

  function go(i, user) {
    active = i; st.tx = items[i].offsetLeft;
    items.forEach((a, n) => n === i ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    if (user) { lock = true; document.querySelector(items[i].hash)?.scrollIntoView(); clearTimeout(lockT); lockT = setTimeout(() => lock = false, 900); }
    kick();
  }

  track.addEventListener('pointerdown', e => {
    down = true; moved = false; startX = e.clientX; track.setPointerCapture(e.pointerId);
    st.tp = 1; st.tx = clampX(localX(e)); kick();
  });
  track.addEventListener('pointermove', e => {
    if (!down) return;
    if (Math.abs(e.clientX - startX) > 3) moved = true;
    st.tx = clampX(localX(e)); kick();
  });
  const release = () => {
    if (!down) return; down = false; st.tp = 0;
    go(nearest(st.x + st.v * .12), true);
  };
  track.addEventListener('pointerup', release);
  track.addEventListener('pointercancel', release);
  items.forEach((a, i) => a.addEventListener('click', e => { e.preventDefault(); if (e.detail === 0) go(i, true); }));
  items.forEach((a, i) => a.addEventListener('focus', () => { if (!down) go(i, false); }));

  /* scroll spy */
  const io = new IntersectionObserver(es => {
    if (lock || down) return;
    es.forEach(en => { if (en.isIntersecting) { const n = items.findIndex(a => a.hash === '#' + en.target.id); if (n > -1 && n !== active) go(n, false); } });
  }, { rootMargin: '-45% 0px -45% 0px' });
  items.forEach(a => { const s = document.querySelector(a.hash); s && io.observe(s); });

  new ResizeObserver(measure).observe(track);
  document.fonts?.ready.then(measure);
  go(0, false); measure();
})();
</script>
</body>
</html>
