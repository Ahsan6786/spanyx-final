<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Desktop Monitor Screen Frame -->
  <rect x="22" y="20" width="56" height="44" rx="4" fill="#38bdf8" stroke="#1e293b" stroke-width="2.8"/>
  
  <!-- Screen Glass Area -->
  <rect x="26" y="24" width="48" height="36" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>

  <!-- Newspaper / Publication Layout on Screen -->
  <!-- Header Bar -->
  <rect x="30" y="28" width="40" height="5" rx="1" fill="#ef4444"/>
  <!-- Image Thumbnail Block -->
  <rect x="30" y="36" width="16" height="12" rx="1.5" fill="#fde047" stroke="#1e293b" stroke-width="1.6"/>
  <!-- Headline & Article Text Lines -->
  <line x1="50" y1="37" x2="68" y2="37" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="66" y2="42" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="46" x2="68" y2="46" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Lower Column Text Lines -->
  <line x1="30" y1="52" x2="68" y2="52" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="30" y1="56" x2="58" y2="56" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Interactive Mouse Pointer Cursor -->
  <path d="M58 44L66 52L63 53L67 58L65 59L61 54L58 57V44Z" fill="#fbbf24" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Monitor Stand & Base -->
  <path d="M46 64V72H54V64" fill="#1e293b" stroke="#1e293b" stroke-width="2.6"/>
  <path d="M34 74C34 73 35 72 37 72H63C65 72 66 73 66 74L68 78H32L34 74Z" fill="#38bdf8" stroke="#1e293b" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
